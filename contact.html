<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact — Jovan Milinić</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./logo/logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="./logo/logo.png?v=2">
    <link rel="apple-touch-icon" href="./logo/logo.png?v=2">

    <meta
        name="description"
        content="Contact Jovan Milinić for UI/UX design, digital design and creative collaborations."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body
    class="contact-page"
    data-page="contact"
>


<header>

    <a
        href="index.html"
        class="brand"
    >

        <div class="logo">
            Jovan Milinić
        </div>

        <div
            class="tag"
            data-i18n="brand.role"
        >
            UI / UX DESIGNER
        </div>

    </a>


    <div class="header-actions">

        <nav>

            <a
                href="index.html"
                data-i18n="nav.home"
            >
                Home
            </a>

            <a
                href="about.html"
                data-i18n="nav.about"
            >
                About
            </a>

            <a
                href="projects.html"
                data-i18n="nav.projects"
            >
                Projects
            </a>

            <a
                href="graphics.html"
                data-i18n="nav.graphics"
            >
                Graphics
            </a>

            <a
                href="contact.html"
                class="active"
                aria-current="page"
                data-i18n="nav.contact"
            >
                Contact
            </a>

        </nav>


        <div
            class="language-switcher"
            aria-label="Language selector"
        >

            <button
                type="button"
                data-language="en"
                aria-label="English"
            >
                EN
            </button>

            <span class="language-divider">
                /
            </span>

            <button
                type="button"
                data-language="sr"
                aria-label="Srpski"
            >
                SR
            </button>

        </div>

    </div>

</header>



<section class="contact">


    <div class="contact-intro">

        <h1 data-i18n="contact.title">
            Contact
        </h1>

        <p data-i18n="contact.description">
            Have a project in mind or just want to connect?
            I’m always open to new opportunities,
            collaborations, and conversations.
        </p>

    </div>



    <div class="contact-grid">


        <!-- LINKEDIN -->

        <a
            class="contact-card linkedin"
            href="https://www.linkedin.com/in/jovan-milini%C4%87-615735283?utm_source=share_via&utm_content=profile&utm_medium=member_ios"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                src="slike/linkedin.png"
                alt="LinkedIn icon"
                data-i18n-alt="alt.linkedin"
            >

        </a>



        <!-- INSTAGRAM -->

        <a
            class="contact-card instagram"
            href="https://www.instagram.com/jovanmilinic/"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                src="slike/instagram.png"
                alt="Instagram icon"
                data-i18n-alt="alt.instagram"
            >

        </a>


    </div>


</section>


<script src="Language.js"></script>

</body>

</html>
