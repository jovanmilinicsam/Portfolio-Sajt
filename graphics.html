<script>

function scrollGallery(id,direction){

    const container =
        document.getElementById(id);

    if(!container){

        console.error(
            "Gallery not found:",
            id
        );

        return;

    }


    const img =
        container.querySelector("img");


    if(!img){
        return;
    }


    const scrollAmount =
        img.offsetWidth;


    container.scrollBy({

        left:
            direction *
            scrollAmount,

        behavior:
            "smooth"

    });

}

</script>
